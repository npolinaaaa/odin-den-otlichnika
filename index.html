<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Один день отличника</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#172033;padding:20px}
.wrap{max-width:900px;margin:auto}header{text-align:center;margin:10px 0 20px}h1{font-size:38px;margin:0 0 8px}.sub{color:#667085}
.card{background:#fff;border-radius:22px;padding:26px;margin:16px 0;box-shadow:0 10px 35px #00000012}
.meta{display:flex;justify-content:space-between;color:#667085;font-size:14px}.progress{height:8px;background:#e7eaf0;border-radius:10px;margin:12px 0 22px}.progress i{display:block;height:100%;background:#6366f1;border-radius:10px}
h2{margin:0 0 12px}.scenario{font-size:18px;line-height:1.55;margin-bottom:20px}.choices{display:grid;gap:11px}
button{border:0;border-radius:14px;padding:15px;background:#f2f4f8;text-align:left;font-size:16px;cursor:pointer}button:hover{background:#e8eaff}.primary{background:#6366f1;color:#fff;text-align:center;font-weight:bold;width:100%}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f7f8fb;padding:12px;border-radius:14px}.name{font-size:12px;color:#667085;margin-bottom:8px}.bar{height:8px;background:#e2e6ee;border-radius:8px}.fill{height:100%;background:#6366f1;border-radius:8px}.val{text-align:right;font-size:12px;margin-top:5px;font-weight:bold}
.result{text-align:center}.badge{display:inline-block;padding:8px 14px;border-radius:99px;background:#eef2ff;color:#4f46e5;font-weight:bold}.hidden{display:none}.note{color:#667085;line-height:1.6}
@media(max-width:700px){h1{font-size:30px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
</style></head><body><div class="wrap">
<header><h1>🎓 Один день отличника</h1><div class="sub">Интерактивный симулятор учебной нагрузки и личного баланса</div></header>
<section id="game">
<div class="card"><div class="meta"><span id="count"></span><span id="time"></span></div><div class="progress"><i id="prog"></i></div>
<h2 id="title"></h2><div class="scenario" id="text"></div><div class="choices" id="choices"></div></div>
<div class="card"><div class="stats" id="stats"></div></div></section>
<section id="result" class="card result hidden"><div style="font-size:48px">📊</div><h2>День завершён</h2><div id="badge" class="badge"></div><p id="summary"></p><p id="note" class="note"></p><button class="primary" onclick="restart()">Пройти ещё раз</button></section>
</div>
<script>
const data=[
["07:00","Утро перед контрольной","Ты плохо спал, потому что вчера поздно готовился. После школы ещё одно дополнительное занятие.",
[["Пойти и ещё час повторять",[8,-12,8,0,-5]],["Пойти только на занятие, вечером закончить вовремя",[5,-4,2,4,0]],["Отказаться и восстановиться",[-2,10,-8,7,4]]]],
["12:30","Контрольная","Ты получил 4, хотя рассчитывал только на 5.",
[["Весь день переживать из-за оценки",[2,-8,10,-2,-4]],["Разобрать ошибки и принять результат",[5,-2,-2,1,0]],["Срочно пытаться всё исправить",[7,-10,8,-2,-5]]]],
["15:30","Друг зовёт гулять","Домашнее задание уже готово. Друг предлагает встретиться на час.",
[["Отказаться и всё перепроверить",[5,-7,5,0,-10]],["Погулять час, затем вернуться к делам",[0,5,-5,0,9]],["Провести вместе весь вечер",[-5,8,-8,1,12]]]],
["18:00","Домашняя работа","Работа готова, но ты заметил небольшую неточность.",
[["Переделать всё с нуля",[6,-9,7,-3,-3]],["Исправить только ошибку",[3,-2,-1,2,0]],["Оставить как есть", [0,4,-5,3,3]]]],
["21:30","Вечер","Ты устал. На завтра осталось немного материала, который можно повторить утром.",
[["Учиться ещё два часа",[8,-15,10,-12,-3]],["Повторить 30 минут и лечь спать",[4,2,-2,8,0]],["Закрыть учебники и отдыхать",[-1,8,-7,10,4]]]],
["23:00","Последний выбор","Перед сном ты думаешь о завтрашних делах. Всё ли должно быть идеально?",
[["Ещё раз всё проверить",[4,-7,8,-7,0]],["Записать главное и завершить день",[2,2,-3,6,2]],["Разобраться завтра",[0,5,-5,7,4]]]]
];
let idx=0,s={study:50,energy:70,stress:25,sleep:70,social:55};
const names={study:"📚 Учёба",energy:"⚡ Энергия",stress:"😰 Стресс",sleep:"😴 Сон",social:"👥 Общение"};
function clamp(x){return Math.max(0,Math.min(100,x))}
function draw(){let d=data[idx];count.textContent=`Ситуация ${idx+1} из ${data.length}`;time.textContent=d[0];title.textContent=d[1];text.textContent=d[2];prog.style.width=(idx/data.length*100)+"%";choices.innerHTML="";
d[3].forEach((c,n)=>{let b=document.createElement("button");b.textContent=(n+1)+". "+c[0];b.onclick=()=>pick(c[1]);choices.appendChild(b)});
stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat"><div class="name">${names[k]}</div><div class="bar"><div class="fill" style="width:${clamp(v)}%"></div></div><div class="val">${Math.round(clamp(v))}/100</div></div>`).join("")}
function pick(a){s.study+=a[0];s.energy+=a[1];s.stress+=a[2];s.sleep+=a[3];s.social+=a[4];idx++;if(idx<data.length)draw();else finish()}
function finish(){game.classList.add("hidden");result.classList.remove("hidden");let label,note;
if(s.stress>=70||s.energy<30||s.sleep<35){label="Риск эмоционального истощения";note="Учёба стала приоритетом почти во всех ситуациях. Результаты могут быть высокими, но восстановление оказалось недостаточным."}
else if(s.study>=70&&s.energy>=45&&s.stress<60){label="Устойчивый режим";note="Тебе удалось сочетать учебную нагрузку с восстановлением, сном и общением."}
else{label="Высокая нагрузка";note="Ты справляешься с учёбой, но некоторые решения заметно увеличили стресс или уменьшили время на восстановление."}
badge.textContent=label;summary.textContent=`Учёба: ${Math.round(clamp(s.study))} • Стресс: ${Math.round(clamp(s.stress))} • Энергия: ${Math.round(clamp(s.energy))} • Сон: ${Math.round(clamp(s.sleep))}`}
function restart(){idx=0;s={study:50,energy:70,stress:25,sleep:70,social:55};game.classList.remove("hidden");result.classList.add("hidden");draw()}draw();
</script></body></html>
